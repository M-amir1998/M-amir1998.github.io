<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Amir Mohammadisarab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #0a0e17;
      color: #e5e7eb;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      background: linear-gradient(120deg, #22d3ee, #818cf8, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
    p { color: #94a3b8; margin: 18px 0 30px; font-family: "JetBrains Mono", monospace; }
    a {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 12px;
      background: linear-gradient(120deg, #22d3ee, #818cf8);
      color: #0a0e17;
      font-weight: 700;
      text-decoration: none;
      transition: transform .3s;
    }
    a:hover { transform: translateY(-3px); }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>// ghost object detected — this page does not exist</p>
    <a href="/">Back to safety</a>
  </div>
</body>
</html>
