<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Profile placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="22" fill="url(#bg)"/>
  <!-- abstract network motif -->
  <g stroke="url(#ac)" stroke-width="1.2" opacity="0.35">
    <line x1="40" y1="270" x2="110" y2="230"/>
    <line x1="110" y1="230" x2="70" y2="180"/>
    <line x1="230" y1="60" x2="285" y2="95"/>
    <line x1="230" y1="60" x2="250" y2="120"/>
  </g>
  <g fill="url(#ac)" opacity="0.55">
    <circle cx="40" cy="270" r="4"/>
    <circle cx="110" cy="230" r="3"/>
    <circle cx="70" cy="180" r="2.5"/>
    <circle cx="230" cy="60" r="4"/>
    <circle cx="285" cy="95" r="3"/>
    <circle cx="250" cy="120" r="2.5"/>
  </g>
  <text x="160" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="86" font-weight="800" fill="url(#ac)">AM</text>
  <text x="160" y="205" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">// your photo here</text>
  <text x="160" y="230" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">replace images/profile.svg</text>
</svg>
