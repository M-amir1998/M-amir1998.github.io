<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img"
     aria-label="Animated diagram: camera, radar, LiDAR and V2X data fused into a world model; a ghost object is rejected">
  <style>
    text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .lbl  { fill: #94a3b8; font-size: 11px; letter-spacing: 0.08em; }
    .sub  { fill: #64748b; font-size: 9px; letter-spacing: 0.05em; }

    .dot  { animation: travel 2.2s linear infinite; }
    .d1 { animation-delay: 0s;    --dy:  99px; }
    .d2 { animation-delay: 0.55s; --dy:  40px; }
    .d3 { animation-delay: 1.1s;  --dy: -19px; }
    .d4 { animation-delay: 1.65s; --dy: -78px; }
    @keyframes travel {
      0%   { transform: translate(0, 0); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(100px, var(--dy)); opacity: 0; }
    }

    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.30; } 50% { opacity: 0.9; } }

    .flow { stroke-dasharray: 6 6; animation: flow 0.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }

    .obj { animation: blip 3s ease-in-out infinite; }
    @keyframes blip { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }

    .ghost { animation: ghost 6s ease-in-out infinite; }
    @keyframes ghost {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      55%  { opacity: 1; }
      75%  { opacity: 0.12; }
      100% { opacity: 0; }
    }
    .cross { animation: cross 6s ease-in-out infinite; }
    @keyframes cross {
      0%, 42%  { opacity: 0; }
      55%      { opacity: 1; }
      78%, 100%{ opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { opacity: 0.8; }
      .ghost, .cross { opacity: 0.6; }
    }
  </style>

  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- ── sensor nodes ─────────────────────────────────────── -->
  <g>
    <!-- camera -->
    <rect x="30" y="20" width="100" height="44" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="50" cy="42" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="50" cy="42" r="2" fill="#22d3ee"/>
    <text x="66" y="46" class="lbl" fill="#22d3ee">CAMERA</text>

    <!-- radar -->
    <rect x="30" y="95" width="100" height="44" rx="10" fill="rgba(129,140,248,0.06)" stroke="#818cf8" stroke-opacity="0.45"/>
    <path d="M45 122 a10 10 0 0 1 10 -10 M45 122 a16 16 0 0 1 16 -16" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="45" cy="122" r="2" fill="#818cf8"/>
    <text x="68" y="121" class="lbl" fill="#818cf8">RADAR</text>

    <!-- lidar -->
    <rect x="30" y="170" width="100" height="44" rx="10" fill="rgba(192,132,252,0.06)" stroke="#c084fc" stroke-opacity="0.45"/>
    <circle cx="50" cy="192" r="3" fill="#c084fc"/>
    <circle cx="50" cy="192" r="7" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="50" cy="192" r="11" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.35"/>
    <text x="68" y="196" class="lbl" fill="#c084fc">LIDAR</text>

    <!-- v2x -->
    <rect x="30" y="245" width="100" height="44" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-opacity="0.45"/>
    <path d="M50 274 v-10 m-5 4 5 -6 5 6" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="271" class="lbl" fill="#22d3ee">V2X</text>
    <text x="66" y="282" class="sub">other vehicles</text>
  </g>

  <!-- ── links sensor → fusion ────────────────────────────── -->
  <g stroke-width="1.2" opacity="0.35">
    <line x1="130" y1="42"  x2="230" y2="141" stroke="#22d3ee"/>
    <line x1="130" y1="117" x2="230" y2="157" stroke="#818cf8"/>
    <line x1="130" y1="192" x2="230" y2="173" stroke="#c084fc"/>
    <line x1="130" y1="267" x2="230" y2="189" stroke="#22d3ee"/>
  </g>

  <!-- ── data packets ─────────────────────────────────────── -->
  <circle class="dot d1" cx="130" cy="42"  r="3" fill="#22d3ee"/>
  <circle class="dot d2" cx="130" cy="117" r="3" fill="#818cf8"/>
  <circle class="dot d3" cx="130" cy="192" r="3" fill="#c084fc"/>
  <circle class="dot d4" cx="130" cy="267" r="3" fill="#22d3ee"/>

  <!-- ── fusion node ──────────────────────────────────────── -->
  <rect class="pulse" x="224" y="119" width="132" height="92" rx="14" fill="none" stroke="url(#fg)" stroke-width="2.5"/>
  <rect x="230" y="125" width="120" height="80" rx="10" fill="rgba(148,163,184,0.05)" stroke="url(#fg)" stroke-opacity="0.6"/>
  <text x="290" y="153" text-anchor="middle" class="lbl" fill="#e5e7eb" font-size="12">MULTISENSOR</text>
  <text x="290" y="169" text-anchor="middle" class="lbl" fill="#e5e7eb" font-size="12">FUSION</text>
  <text x="290" y="188" text-anchor="middle" class="sub">association · tracking</text>

  <!-- ── fusion → world model ─────────────────────────────── -->
  <line class="flow" x1="356" y1="165" x2="402" y2="165" stroke="#818cf8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── world model panel ────────────────────────────────── -->
  <rect x="410" y="55" width="130" height="230" rx="12" fill="rgba(148,163,184,0.04)" stroke="#94a3b8" stroke-opacity="0.3"/>
  <text x="475" y="78" text-anchor="middle" class="lbl" fill="#e5e7eb">WORLD MODEL</text>

  <g class="obj">
    <rect x="425" y="95" width="100" height="30" rx="7" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="433" y="114" class="lbl" fill="#22d3ee" font-size="10">car · id 07</text>
  </g>
  <g class="obj" style="animation-delay:.7s">
    <rect x="425" y="137" width="100" height="30" rx="7" fill="none" stroke="#818cf8" stroke-width="1.4"/>
    <text x="433" y="156" class="lbl" fill="#818cf8" font-size="10">truck · id 03</text>
  </g>
  <g class="obj" style="animation-delay:1.4s">
    <rect x="425" y="179" width="100" height="30" rx="7" fill="none" stroke="#c084fc" stroke-width="1.4"/>
    <text x="433" y="198" class="lbl" fill="#c084fc" font-size="10">ped · id 12</text>
  </g>

  <!-- ghost object: appears, then rejected by LLM reasoning -->
  <g class="ghost">
    <rect x="425" y="221" width="100" height="30" rx="7" fill="none" stroke="#f87171" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="433" y="240" class="lbl" fill="#f87171" font-size="10">ghost · ??</text>
  </g>
  <g class="cross" stroke="#f87171" stroke-width="2" stroke-linecap="round">
    <line x1="430" y1="226" x2="520" y2="246"/>
    <line x1="520" y1="226" x2="430" y2="246"/>
  </g>
  <text class="cross" x="475" y="268" text-anchor="middle" fill="#f87171" font-size="9" letter-spacing="0.05em">rejected · LLM reasoning</text>

  <!-- caption -->
  <text x="290" y="320" text-anchor="middle" class="sub">cooperative perception pipeline — connected automated driving</text>
</svg>
